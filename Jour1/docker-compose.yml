version: '3.8'

services:
  mongo-ipssi:
    image: mongo:7.0
    container_name: mongo-ipssi
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ipssi2025
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    container_name: mongo-express-ipssi
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ipssi2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:ipssi2025@mongo-ipssi:27017/?authSource=admin
    depends_on:
      - mongo-ipssi
      